<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Individuell gestaltete Hochzeitskarten, Save-the-Date-Karten und sonstige Papeterie sowie einzigartige 3D Hochzeitsdekoration.">
    <title>Individuelle Hochzeitskarten – PDB Design</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header>
      <nav id="navbar">
        <img></img>
        <a href="/index.html" class="navigation">Home</a>
        <a href="/unterseiten/leistungen.html" class="navigation">Leistungen</a>
        <a href="/unterseiten/galerie.html" class="navigation">Galerie</a>
        <a href="/unterseiten/kontakt.html" class="navigation">Kontakt</a>
      </nav>
    </header>

    <main>
        <div class="kontakt">
            <h2 class="kontakt-hl">Interesse geweckt?</h2>
            <p class="kontakt-text">Du hast ein Event und benötigst noch das i-Tüpfelchen?
            Melde dich gerne per <a href="mailto:patrizia-blaschke@web.de" class="email2">Email</a> oder fülle folgendes Kontaktformular aus. Ich freue mich, einzigartige Designs für dich zu erstellen!</p>
            <form class="kontakt-form" action="mailto:patrizia-blaschke@web.de" method="post" enctype="text/plain">
                <label for="name" class="kontakt-label">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email" class="kontakt-label">E-Mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="message" class="kontakt-label">Nachricht:</label>
                <textarea id="message" name="message" rows="10" required></textarea>

                <input type="submit" value="Senden" class="button">
            </form>
        </div>
    </main>

    <footer class="footer2">
      <a href="/unterseiten/impressum.html">Impressum</a>
      <a href="/unterseiten/datenschutz.html">Datenschutz</a>
    </footer>
  </body>
</html>
